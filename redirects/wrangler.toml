# Redirect Worker for the retired Vulnetix docs hosts. Every request to one of
# these hosts is answered with a 301 to its page on docs.vulnetix.com.
#
# worker.js is generated by scripts/build-redirects.mjs from
# migration/redirects/*.tsv. Rebuild, then deploy by hand from this directory:
#
#   node ../scripts/build-redirects.mjs --check ../dist && npx wrangler deploy
#
# A route only takes effect once its host's DNS record is proxied. Each host
# gets a proxied placeholder (AAAA 100::) from vdb-site/terraform/dns.tf
# var.retired_docs_hosts after its old GitHub Pages CNAME is destroyed.
name = "vulnetix-docs-redirects"
main = "worker.js"
compatibility_date = "2026-11-01"
account_id = "e302589106b4c4287aebe65763eb4f80"
workers_dev = false

routes = [
  { pattern = "docs.cli.vulnetix.com/*", zone_name = "vulnetix.com" },
  { pattern = "docs.guardrails.vulnetix.com/*", zone_name = "vulnetix.com" },
  { pattern = "docs.mcp.vulnetix.com/*", zone_name = "vulnetix.com" },
  { pattern = "ai-docs.vulnetix.com/*", zone_name = "vulnetix.com" },
  { pattern = "docs.code.vulnetix.com/*", zone_name = "vulnetix.com" },
]
