name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy mid-flight: two overlapping deploys race on the
# single Pages artifact.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      # Full history: the sitemap's <lastmod> falls back to each page's last
      # commit when its front matter has no `updated`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # corepack makes the yarn pinned in package.json the yarn that runs. Do
      # not use setup-node's `cache: yarn`: it probes with yarn 1.x first.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # The scanner's parsing rules, the coverage rules and the Markdown plugins.
      - name: Test
        run: yarn test

      # Every atom in inventory/atoms.json must map to a documented feature.
      # The scan itself runs locally against sibling checkouts (see README).
      - name: Check feature coverage
        run: node scripts/inventory-check.mjs --strict

      # Builds the site and the Pagefind search index into dist/.
      - name: Build
        run: yarn build

      # public/CNAME binds the custom domain. If it goes missing Pages unbinds
      # docs.vulnetix.com, which looks like DNS but is not.
      - name: Verify the custom domain survived the build
        run: |
          test -f dist/CNAME || { echo "dist/CNAME missing"; exit 1; }
          grep -qx 'docs.vulnetix.com' dist/CNAME || { echo "dist/CNAME mismatch:"; cat dist/CNAME; exit 1; }

      - name: Check internal links
        run: node scripts/check-links.mjs dist

      # Every same-origin stylesheet, preload and script carries the digest of
      # the file it loads, and each page's CSP hashes match its inline code.
      - name: Check subresource integrity
        run: node scripts/sri.mjs --check dist

      # Every old docs URL must land on a page that exists, and the committed
      # Worker must be the one the maps build (it is deployed by hand).
      - name: Check retired-host redirects
        run: |
          node scripts/build-redirects.mjs --check dist
          git diff --exit-code redirects/worker.js || { echo "redirects/worker.js is stale: run node scripts/build-redirects.mjs and commit it"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  # The generated pages (migration/generators/*) must match their source
  # repositories' main branches. This job regenerates them from fresh checkouts
  # and fails when a page differs in anything but its provenance stamps (the
  # `checked:` commits, the `updated:` date and the "Generated by" comment).
  # It does not gate the deploy: an upstream change should not block an
  # unrelated docs fix, but it should turn the run red until someone
  # regenerates and commits.
  #
  # kind-reference.mjs writes the page of every Platform IaC kind, the kind
  # catalogue, the CEL reference and the Terraform resource list. It reads the
  # config-schemas and cli releases pinned in migration/generators/releases.json
  # (the pages record the same tags in their `checked:` line) and the
  # terraform-provider-resolve main branch. A release of config-schemas or the
  # cli therefore adds a warning, not a red run. To move to it, run
  # `node migration/generators/releases.mjs --bump`, check out those tags,
  # run the generators and commit the pages with the new pins.
  generators:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - uses: actions/checkout@v5
        with:
          path: platform-docs

      - uses: actions/setup-node@v5
        with:
          node-version-file: platform-docs/.nvmrc

      # The generated kind pages quote the releases pinned in releases.json,
      # not the newest ones. Warn when a newer release exists; never fail on it.
      - name: Read the pinned releases
        id: releases
        working-directory: platform-docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node migration/generators/releases.mjs --check || echo "::warning::could not look for newer releases"
          echo "schemas=$(node -p 'require("./migration/generators/releases.json").configSchemas')" >> "$GITHUB_OUTPUT"

      # Tags are needed: the generators read which config-schemas release each
      # cli tag embedded, and which release first had each kind.
      - uses: actions/checkout@v5
        with:
          repository: Vulnetix/cli
          path: cli
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@v5
        with:
          repository: Vulnetix/config-schemas
          path: config-schemas
          ref: ${{ steps.releases.outputs.schemas }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@v5
        with:
          repository: Vulnetix/terraform-provider-resolve
          path: terraform-provider-resolve
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: Vulnetix/malscan-engine
          path: malscan-engine
          # scanner-catalogues reads patterns.toml at the tag the CLI pins.
          fetch-depth: 0
          fetch-tags: true

      - name: Regenerate the generated pages
        working-directory: platform-docs
        run: |
          node migration/generators/kind-reference.mjs --schemas ../config-schemas --provider ../terraform-provider-resolve --cli ../cli
          node migration/generators/gha-scanners.mjs --cli ../cli
          node migration/generators/github-rules.mjs --cli ../cli
          node migration/generators/sast-rules.mjs --cli ../cli
          node migration/generators/scanner-catalogues.mjs --cli ../cli --engine ../malscan-engine

      - name: Fail if a generated page is stale
        working-directory: platform-docs
        run: |
          git add -N .
          if ! git diff --exit-code --stat \
              -I '^checked: ' -I '^updated: ' -I '^<!-- Generated by ' -I 'cli@[0-9a-f][0-9a-f]*' -- src; then
            git diff -I '^checked: ' -I '^updated: ' -I '^<!-- Generated by ' -I 'cli@[0-9a-f][0-9a-f]*' -- src | head -200
            echo "::error::generated pages are stale: run the generators in migration/generators against current checkouts and commit"
            exit 1
          fi

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell the IndexNow engines about the pages once they are live. It reads the
  # live sitemap, so it runs after deploy. seo.yml repeats it daily.
  indexnow:
    needs: deploy
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Submit to IndexNow
        run: node scripts/indexnow.mjs
