name: SEO IndexNow
# Tells the IndexNow engines (Bing, Yandex, Seznam, Naver, Mojeek, and
# DuckDuckGo through Bing) about every page in the live sitemap. Deploy Pages
# does the same after each deploy; this catches a missed or failed submission.
# Google reads the sitemap from robots.txt. No secrets: the key is public.
on:
  schedule:
    - cron: '0 7 * * *' # daily, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Submit to IndexNow
        run: node scripts/indexnow.mjs
